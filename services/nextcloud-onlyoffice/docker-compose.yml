version: '3.8'

services:
  db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  app:
    image: nextcloud:25-apache
    restart: always
    ports:
      - 80:80
    depends_on:
      - db
    volumes:
      - nc_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_ALLOW_LOCAL_REMOTE_SERVERS=true
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - NEXTCLOUD_UPDATE=${NEXTCLOUD_UPDATE}

  onlyoffice:
    image: onlyoffice/documentserver:7.2
    restart: always
    ports:
      - 8080:80
    environment:
      - JWT_ENABLED=false

volumes:
  db_data:
  nc_data: